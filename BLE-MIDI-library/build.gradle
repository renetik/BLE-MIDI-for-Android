plugins {
    id 'com.android.library'
    id 'maven-publish'
}

android {
    compileSdk = project.properties.sdk_version

    defaultConfig {
        minSdkVersion  project.properties.min_sdk_version
        targetSdkVersion   project.properties.sdk_version
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    defaultConfig {
        consumerProguardFiles 'proguard-rules.pro'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
        }
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
    namespace = 'jp.kshoji.blemidi'
}

repositories {
    maven {
        url = 'https://github.com/kshoji/javax.sound.midi-for-Android/raw/master/javax.sound.midi/repository'
    }
    mavenCentral()
}

dependencies {
    api 'jp.kshoji:javax-sound-midi:0.0.6:@aar'
    api 'com.android.support:support-annotations:28.0.0'
    api fileTree(dir: 'libs', include: ['*.jar'])
}

publishing {
    publications {
        release(MavenPublication) {
            group = 'jp.kshoji'
            artifactId = 'ble-midi'
            version = '0.0.20'

            afterEvaluate {
                from components.release
            }
        }
    }

    repositories {
        maven {
            url = "${project.projectDir}/../library/repository"
        }
    }
}
